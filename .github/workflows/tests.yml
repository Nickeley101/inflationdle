name: Tests

# The site's test suite (tests/): unit tests for the Worker, data and published files; the game in real browsers
# (Chromium, iPhone Safari's WebKit and Firefox, at desktop and phone sizes) with accessibility scans; and security
# scans for committed secrets and vulnerable test dependencies. Runs on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Worker, data, site files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:unit
        working-directory: tests

  browser:
    name: Browser (game, accessibility, security)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test tools
        working-directory: tests
        run: |
          # Ubuntu mirrors sometimes stall; give up on a dead one after 30 s and wait for the package lock instead of failing.
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\nDPkg::Lock::Timeout "600";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium webkit firefox
      - name: Run browser tests
        working-directory: tests
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          # Reports are ~150 MB; keeping them long filled the private repo's artifact storage and stopped the posting markers.
          retention-days: 2

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the latest
      - name: Scan the whole history for committed secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --verbose
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check test dependencies for known vulnerabilities
        working-directory: tests
        run: |
          npm install --no-fund --no-audit --ignore-scripts
          npm audit --audit-level=high
