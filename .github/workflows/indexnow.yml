name: IndexNow

# Tells Bing, Yandex and other IndexNow search engines which pages changed, so they recrawl them in hours instead of
# weeks. Google doesn't use IndexNow; it reads the sitemap. The key file at the site root proves the site is ours; the
# key is public by design.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "prices/**"
      - "sitemap.xml"
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every page in the sitemap"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Submit changed pages
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Give Cloudflare time to deploy the push before search engines come to look.
          [ "$ALL" = "true" ] || sleep 150
          node scripts/indexnow.mjs
