<!doctype html><html><head><meta charset="utf-8">
<!-- Link preview image (og.png, 1200x630). Rendered by scripts/render-banners.mjs. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap">
<script src="series.js"></script>
<style>
:root{--bg:#0a0e13;--line:#233040;--text:#dbe4ee;--muted:#7c8b9d;--up:#1fd67f;--down:#ff4d5e;--warm:#f5b83d;--cyan:#4cc9f0;
--mono:"JetBrains Mono","DejaVu Sans Mono",monospace;--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--sans:"IBM Plex Sans","DejaVu Sans",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);position:relative}
.tape{height:64px;border-bottom:1px solid var(--line);background:#070a0e;white-space:nowrap;overflow:hidden;font:600 22px/64px var(--mono);padding-left:40px}
.tape span{margin-right:34px}.tape b{color:var(--text)}.tape i{font-style:normal;color:var(--muted)}.tape .pos{color:var(--up)}
.main{padding:70px 64px 0}
h1{font:800 150px/.9 var(--disp);white-space:nowrap;text-transform:uppercase;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--up);text-shadow:0 0 34px rgba(31,214,127,.5)}
.tag{margin-top:26px;font:500 36px/1.2 var(--sans);color:var(--muted)}.tag b{font-weight:500;color:var(--warm)}
.sq{position:absolute;left:64px;top:434px;display:flex;gap:12px}.sq i{width:44px;height:44px;border-radius:4px;display:block}
.sq .c{background:var(--down)}.sq .w{background:var(--warm)}.sq .h{background:var(--up);box-shadow:0 0 16px rgba(31,214,127,.45)}
.cta{position:absolute;left:64px;top:507px;height:66px;padding:0 26px;border-radius:5px;background:var(--cyan);color:#061018;font:800 28px/66px var(--mono);box-shadow:0 0 22px rgba(76,201,240,.35)}
svg{position:absolute;right:76px;bottom:56px}
</style></head><body>
<div class="tape" id="tape"></div>
<div class="main"><h1>Inflation<em>dle</em></h1>
  <p class="tag">Guess what it cost. <b>A new item every day.</b></p></div>
<div class="sq"><i class="c"></i><i class="w"></i><i class="w"></i><i class="h"></i></div>
<div class="cta">PLAY FREE → inflationdle.com</div>
<svg id="ch" width="400" height="180" viewBox="0 0 400 180" style="overflow:visible"></svg>
<script>
// Ticker: 1980 vs now for a few staples, the same "SYM year price change" read as the site's tape.
// Only 1980 prices that are not a scheduled daily round (checked against data/schedule.json), so the preview gives nothing away.
const T=[["EGGS","EGGS"],["BREAD","BREAD"],["GAS","GAS"],["BANANA","BANANAS"],["RICE","RICE"]];
document.getElementById("tape").innerHTML=T.map(([k,l])=>{const p=SER[k].pts,a=p.find(x=>x[0]===1980)||p[0],z=p[p.length-1];
  return `<span><b>${l}</b> <i>${a[0]}</i> $${a[1].toFixed(2)} <span class="pos">+${Math.round((z[1]/a[1]-1)*100)}%</span></span>`}).join("");
// Chart: the white bread series as an unlabelled rising line with a fading green fill, like the launch-day preview.
const P=SER.BREAD.pts,W=400,H=180,x0=P[0][0],x1=P[P.length-1][0],ym=Math.max(...P.map(p=>p[1]));
const X=x=>(x-x0)/(x1-x0)*W,Y=v=>H-v/ym*H;
const d=P.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
document.getElementById("ch").innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fd67f" stop-opacity=".3"/><stop offset="1" stop-color="#1fd67f" stop-opacity="0"/></linearGradient></defs>`+
 `<path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#1fd67f" stroke-width="5" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(31,214,127,.5))"/>`;
// Fit the wordmark to the width whatever font loads.
document.fonts.ready.then(()=>{const h=document.querySelector("h1"),w=1200-128;let s=150;while(h.scrollWidth>w&&s>80)h.style.fontSize=(s-=2)+"px"});
</script></body></html>
