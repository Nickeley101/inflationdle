<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=block">
<script src="series.js"></script>
<style>
:root{--bg:#0a0e13;--panel:#11171f;--line:#233040;--text:#dbe4ee;--muted:#7c8b9d;--up:#1fd67f;--down:#ff4d5e;--warm:#f5b83d;--cyan:#4cc9f0;
--mono:"JetBrains Mono",ui-monospace,monospace;--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(900px 700px at 50% 35%,#12202c 0%,var(--bg) 70%)}
.abs{position:absolute;left:110px;right:110px;text-align:center}
.brand{top:150px;font:800 56px var(--disp);letter-spacing:.02em;text-transform:uppercase}
.brand em,.end .logo em{font-style:normal;color:var(--up);text-shadow:0 0 30px rgba(31,214,127,.5)}
#head{top:250px}
.title{font:800 112px/1 var(--disp);text-transform:uppercase}
.title em{font-style:normal;color:var(--cyan);text-shadow:0 0 36px rgba(76,201,240,.45)}
.hook{margin-top:18px;font:600 46px var(--sans);color:var(--warm)}
#tiles{position:absolute;left:100px;top:500px;width:880px;height:1080px;display:grid;grid-template-columns:1fr 1fr;gap:24px;grid-auto-rows:1fr}
.tile{position:relative;min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:20px 28px}
.tile.win{border-color:var(--warm);box-shadow:0 0 40px rgba(245,184,61,.35)}
.tile .n{font:700 46px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.04em}
.tile .u{font:500 24px var(--sans);color:var(--muted)}
.tile .row{display:flex;flex-direction:column;margin-top:8px}
.tile .lab{font:600 22px var(--mono);color:#56657a;letter-spacing:.06em}
.tile .then{font:600 36px var(--mono);color:var(--muted)}
.tile .now{font:800 88px/1 var(--disp);color:var(--text)}
.tile .pct{margin-top:10px;align-self:flex-start;display:inline-block;padding:4px 16px;border-radius:30px;font:800 32px var(--mono);background:rgba(124,139,157,.12);color:var(--muted)}
.pct.hot{background:rgba(255,77,94,.14);color:var(--down)} .pct.cool{background:rgba(31,214,127,.12);color:var(--up)}
.tile .tag{position:absolute;top:18px;right:18px;padding:4px 14px;border-radius:10px;background:var(--warm);color:#1a1200;font:800 24px var(--mono);letter-spacing:.06em;opacity:0}
.cd{top:1610px;opacity:0}
.cd .l{font:600 44px var(--sans)}
.cd .n{font:800 120px/1 var(--disp);color:var(--warm);margin-top:4px}
.foot{top:1620px;opacity:0}
.foot .a{font:800 60px var(--disp);text-transform:uppercase}.foot .a em{font-style:normal;color:var(--warm)}
.leg{margin-top:12px;font:500 28px var(--sans);color:var(--muted)}
.leg b{font-family:var(--mono)}.leg .h{color:var(--down)}.leg .c{color:var(--up)}
.cta{top:1780px;font:600 44px var(--sans);opacity:0}
.src{top:1860px;font:400 22px var(--mono);color:#56657a;opacity:0}
.end{top:560px;opacity:0}
.end h2{font:800 96px/1.02 var(--disp);text-transform:uppercase}
.end h2 em{font-style:normal;color:var(--warm)}
.end .logo{margin-top:110px;font:800 110px var(--disp);letter-spacing:.02em;text-transform:uppercase}
.end .s{margin-top:10px;font:500 42px var(--sans);color:var(--muted)}
.end .bio{margin-top:40px;font:700 46px var(--mono);color:var(--cyan)}
</style></head>
<body><div id="stage">
<div class="abs brand" id="brand">Inflation<em>dle</em></div>
<div class="abs" id="head"><div class="title"><em id="yr"></em> vs today</div><div class="hook">Which one jumped the most?</div></div>
<div id="tiles"></div>
<div class="abs cd" id="cd"><div class="l">Comment your pick</div><div class="n" id="cdn">3</div></div>
<div class="abs foot" id="foot"><div class="a">All prices since <span id="yr2"></span>: <em id="cpiup"></em></div>
 <div class="leg"><b class="h">red</b> = rose faster than inflation · <b class="c">green</b> = slower</div></div>
<div class="abs cta" id="cta">Which one surprised you?</div>
<div class="abs src" id="src"></div>
<div class="abs end" id="end">
  <h2>Guess a new <em>price</em> every day</h2>
  <div class="logo">Inflation<em>dle</em></div>
  <div class="s">Free daily game</div>
  <div class="bio">inflationdle.com</div>
</div>
</div>
<script>
// Evening post: U.S. average prices in one year against today's, e.g. ?year=1985&items=EGGS,BREAD,COFFEE,BANANA,BACON,GAS.
// scripts/daily-video.mjs --evening picks the year and items, leaving out every round that is live or still to come.
// Timeline (15 s, matched by eveningSoundtrack() in scripts/video-audio.mjs): the then-prices and the question from the
// first frame, a 3-2-1 "comment your pick", the prices ticking up to today, the biggest jump, the end card, then the
// opening frame again so a replay loops smoothly.
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const win=(t,a,b,f=.35)=>Math.min(ease((t-a)/f),ease((b-t)/f));
const Q=new URLSearchParams(location.search), YEAR=+Q.get("year")||1980;
const KEYS=(Q.get("items")||"EGGS,BREAD,COFFEE,BANANA,BACON,GAS").split(",").slice(0,6);
// Mirrors fmt() in src/game.js.
const fmt=p=>"$"+(p<1?p.toFixed(3).replace(/0$/,""):p.toLocaleString("en-US",{minimumFractionDigits:p>=1000?0:2,maximumFractionDigits:p>=1000?0:2}));
const SHORT={EGGS:"Eggs",COFFEE:"Coffee",OJ:"Frozen OJ",PORK:"Pork chops",PASTA:"Pasta",CHKN:"Chicken breast",WCHKN:"Whole chicken",
  STEAK:"Sirloin steak",ROAST:"Chuck roast",HAM:"Ham",RICE:"White rice",GAS:"Gas",POWER:"Electricity",BEEF:"Ground beef",COOKIE:"Choc. chip cookies"};
const CPI_AT=(y,m)=>{const i=(y-1975)*12+m-1, v=CPI.v; return v[i]??(v[i-1]+v[i+1])/2};
const CPI_UP=Math.round((CPI.v[CPI.v.length-1]/CPI_AT(YEAR,1)-1)*100);
const tiles=KEYS.map(k=>{const S=SER[k]; if(!S) throw new Error("unknown series "+k); const p=S.pts.find(p=>p[0]===YEAR); if(!p) throw new Error(`${k} has no ${YEAR} price`);
  const a=p[1], b=S.pts[S.pts.length-1][1]; return {n:SHORT[k]||S.name.split(",")[0], u:S.unit, a, b, pct:Math.round((b/a-1)*100)}});
const TOP=tiles.reduce((m,d,i)=>d.pct>tiles[m].pct?i:m,0);
$("tiles").innerHTML=tiles.map((d,i)=>`<div class="tile" id="t${i}"><span class="tag" id="g${i}">BIGGEST JUMP</span><div><div class="n">${d.n}</div><div class="u">${d.u}</div></div>
 <div class="row"><span class="then"><span class="lab">${YEAR} </span>${fmt(d.a)}</span><span class="lab" style="margin-top:8px">TODAY</span><span class="now" id="v${i}">${fmt(d.a)}</span></div>
 <span class="pct" id="p${i}">+0%</span></div>`).join("");
$("yr").textContent=YEAR; $("yr2").textContent=YEAR; $("cpiup").textContent="+"+CPI_UP+"%";
{const MON=["January","February","March","April","May","June","July","August","September","October","November","December"], L=SER.EGGS.pts[SER.EGGS.pts.length-1][3];
 const [y,m]=(L||"").split("-").map(Number); $("src").textContent=`January ${YEAR} vs ${m?MON[m-1]+" "+y:"today"} · BLS average prices & CPI-U via FRED`}
window.render=function(t){
  const back=t>=14.2; // the opening frame again, for the loop
  const main=back?ease((t-14.2)/.35):t<12.2?1:1-ease((t-12.2)/.3);
  for(const id of ["brand","head","tiles"]) $(id).style.opacity=main;
  $("cd").style.opacity=back?0:win(t,1,4,.3); const n=3-Math.floor(clamp(t-1.1,0,2.99)); $("cdn").textContent=n;
  $("cdn").style.transform=`scale(${1+.25*(1-ease(((t-1.1)%1)/.3))})`;
  const c=back?0:ease((t-4)/2.8);
  tiles.forEach((d,i)=>{
    $("v"+i).textContent=fmt(d.a+(d.b-d.a)*c); $("p"+i).textContent=(d.pct>=0?"+":"")+Math.round(d.pct*c)+"%";
    $("p"+i).className="pct"+(c>=1?(d.pct>CPI_UP?" hot":" cool"):"");
    $("v"+i).style.color=c>=1?(d.pct>CPI_UP?"var(--down)":"var(--up)"):"var(--text)";
    const w=i===TOP&&!back&&t>=7; $("t"+i).classList.toggle("win",w); $("g"+i).style.opacity=w?ease((t-7)/.25):0;
    $("t"+i).style.transform=`scale(${w?1+.05*(1-ease((t-7)/.4)):1})`;
  });
  $("foot").style.opacity=back?0:win(t,7.6,12.2,.4);
  $("cta").style.opacity=back?0:win(t,9,12.2,.4);
  $("src").style.opacity=back?0:win(t,7.6,12.2,.4);
  $("end").style.opacity=win(t,12.4,14.1,.35); $("end").style.transform=`translateY(${(1-ease((t-12.4)/.6))*50}px)`;
};
render(0);
</script></body></html>
