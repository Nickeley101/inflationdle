<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=block">
<script src="series.js"></script>
<style>
:root{--bg:#0a0e13;--panel:#11171f;--line:#233040;--text:#dbe4ee;--muted:#7c8b9d;--up:#1fd67f;--down:#ff4d5e;--warm:#f5b83d;--cyan:#4cc9f0;
--mono:"JetBrains Mono",ui-monospace,monospace;--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#glow{position:absolute;inset:0;background:radial-gradient(900px 760px at 50% 40%,#12202c 0%,rgba(10,14,19,0) 70%)}
#hot{position:absolute;inset:0;background:radial-gradient(900px 760px at 50% 45%,rgba(255,77,94,.22) 0%,rgba(10,14,19,0) 70%);opacity:0}
#cam{position:absolute;inset:0;transform-origin:50% 55%}
.abs{position:absolute;left:110px;right:110px;text-align:center}
.brand{top:150px;font:800 56px var(--disp);letter-spacing:.02em;text-transform:uppercase}
.brand em,.end .logo em{font-style:normal;color:var(--up);text-shadow:0 0 30px rgba(31,214,127,.5)}
#head{top:240px}
.item{font:800 150px/1 var(--disp);white-space:nowrap;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 36px rgba(76,201,240,.45)}
.hook{margin-top:16px;font:600 46px/1.2 var(--sans);color:var(--warm)}
.unit{margin-top:12px;font:500 30px var(--sans);color:var(--muted)}
#read{top:630px;display:flex;justify-content:space-between;align-items:baseline}
#yr,#px{display:inline-block;transform-origin:0 70%}
#yr{font:800 96px/1 var(--mono);color:var(--text)}
#prod{top:590px;text-align:left;font:600 30px var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#px{font:800 128px/1 var(--disp);color:var(--up);transform-origin:100% 70%}
#run{top:770px;text-align:right;font:700 36px var(--mono);color:var(--muted)}
#chart{position:absolute;left:110px;top:840px;width:860px;height:600px;overflow:visible}
#chart .g{stroke:var(--line);stroke-width:2}
#chart text{font:600 24px var(--mono);fill:#56657a}
#area{fill:url(#fill)}
#ln{fill:none;stroke:var(--up);stroke-width:8;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 14px rgba(31,214,127,.6))}
#dot{fill:#fff}
#ring{fill:none;stroke:var(--up);stroke-width:4}
.chip{position:absolute;padding:6px 16px;border-radius:12px;font:800 36px var(--mono);white-space:nowrap;opacity:0;transform:translate(-50%,-100%)}
.chip.u{background:var(--down);color:#1a0004}.chip.d{background:var(--up);color:#00170b}
.pause{top:1500px;font:700 50px var(--sans)}
.pause em{font-style:normal;color:var(--warm)}
.sum{top:1470px;opacity:0}
.sum .a{font:800 190px/1 var(--disp);color:var(--down);text-shadow:0 0 50px rgba(255,77,94,.45)}
.sum .a.cool{color:var(--up);text-shadow:0 0 50px rgba(31,214,127,.45)}
.sum .b{margin-top:8px;font:600 36px var(--sans);color:var(--text)}
.sum .b span{color:var(--muted)}
.cta{top:1760px;font:700 44px var(--sans);color:var(--warm);white-space:nowrap;opacity:0}
.src{top:1860px;font:400 22px var(--mono);color:#56657a}
.end{top:600px;opacity:0}
.end h2{font:800 96px/1.02 var(--disp);text-transform:uppercase}
.end h2 em{font-style:normal;color:var(--warm)}
.end .logo{margin-top:110px;font:800 110px var(--disp);letter-spacing:.02em;text-transform:uppercase}
.end .s{margin-top:10px;font:500 42px var(--sans);color:var(--muted)}
.end .bio{margin-top:40px;font:700 52px var(--mono);color:var(--cyan)}
</style></head>
<body><div id="stage">
<div id="glow"></div><div id="hot"></div>
<div id="cam">
<div class="abs brand" id="brand">Inflation<em>dle</em></div>
<div class="abs" id="head"><div class="item" id="item"></div><div class="hook" id="hook"></div><div class="unit" id="unit"></div></div>
<div class="abs" id="prod"></div>
<div class="abs" id="read"><span id="yr"></span><span id="px"></span></div>
<div class="abs" id="run"></div>
<svg id="chart" viewBox="0 0 860 600"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#1fd67f" stop-opacity=".28"/><stop offset="1" stop-color="#1fd67f" stop-opacity="0"/></linearGradient></defs>
 <g id="grid"></g><polygon id="area"/><polyline id="ln"/><circle id="ring" r="12"/><circle id="dot" r="11"/></svg>
<div id="chips"></div>
<div class="abs pause" id="pause">Pause on <em>your year</em></div>
<div class="abs sum" id="sum"><div class="a" id="suma"></div><div class="b" id="sumb"></div></div>
<div class="abs cta" id="cta"></div>
<div class="abs src" id="src"></div>
</div>
<div class="abs end" id="end">
  <h2>Guess a new <em>price</em> every day</h2>
  <div class="logo">Inflation<em>dle</em></div>
  <div class="s">Free daily game</div>
  <div class="bio">inflationdle.com</div>
</div>
</div>
<script>
// Spotlight post: one item people care about (beer, gas, steak...) racing year by year from its first price to today,
// e.g. ?sym=GAS.CHI&name=Gas&hook=What did gas cost in Chicago the year you got your license?&cta=Comment the year you got your license
// (&src= names the source for non-BLS items). scripts/daily-video.mjs --spotlight picks the item, leaving out live rounds' items.
// Timeline (10 s, matched by spotlightSoundtrack() in scripts/video-audio.mjs): the item and hook from the first frame;
// the years and prices racing to today (an even share of time per year, so any year can be paused on) while the chart
// rescales to keep up, with a red chip on every big one-year jump; today's price punching in; the total change slamming
// in against inflation; the end card; then the opening frame again so a replay loops smoothly.
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back3=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};  // overshoots, then settles
const win=(t,a,b,f=.3)=>Math.min(ease((t-a)/f),ease((b-t)/f));
const Q=new URLSearchParams(location.search), SYM=Q.get("sym")||"BEER", S=SER[SYM];
if(!S) throw new Error("unknown series "+SYM);
// CPI starts in 1975, so the race does too; every row is a real published price (no filled-in years).
const P=S.pts.filter(p=>p[0]>=1975), A=P[0], B=P[P.length-1], Y0=Math.floor(A[0]);
// Mirrors fmt() in src/game.js, except whole prices of $100 or more (a $749 phone) drop the cents.
const fmt=p=>"$"+(p<1?p.toFixed(3).replace(/0$/,""):p.toLocaleString("en-US",(c=>({minimumFractionDigits:c,maximumFractionDigits:c}))(p>=1000||p>=100&&Number.isInteger(p)?0:2)));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const label=p=>{const d=p[3]||""; const m=d.match(/^(\d{4})-(\d{2})$/); return m?MON[+m[2]-1]+" "+m[1]:d.replace(/^(\w{3})\w*/,"$1")||String(p[0])};
const CPI_AT=(y,m)=>{const i=(y-1975)*12+m-1, v=CPI.v; return v[i]??v[v.length-1]};
const CPI_NOW=CPI.v[CPI.v.length-1], pctOf=v=>Math.round((v/A[1]-1)*100);
const pct=pctOf(B[1]), CPI_UP=Math.round((CPI_NOW/CPI_AT(Y0,1)-1)*100);
// Inflation since the start, as of each point (January of its year; the latest point uses the latest CPI).
const cpiUp=p=>Math.round(((Number.isInteger(p[0])?CPI_AT(p[0],1):CPI_NOW)/CPI_AT(Y0,1)-1)*100);
// One-year changes between consecutive whole years, for the jump chips (the latest month isn't a full year).
const JUMP=P.map((p,i)=>i&&Number.isInteger(p[0])&&p[0]-P[i-1][0]===1?Math.round((p[1]/P[i-1][1]-1)*100):0);
$("item").textContent=Q.get("name")||S.name.split(",")[0];
$("hook").textContent=Q.get("hook")||`What did it cost the year you were born?`;
// "Per gallon · Boston area", "Per dozen · Northeast cities", "Per dozen · U.S. average".
const LOC=S.loc||"", where=/^U\.S\. City/.test(LOC)?"U.S. average":/\(urban\)$/.test(LOC)?LOC.replace(" (urban)"," cities"):/^World/.test(LOC)?"world market price":/^U\.S\./.test(LOC)?"U.S.":LOC;
$("unit").textContent=S.unit[0].toUpperCase()+S.unit.slice(1)+(/U\.S\./.test(S.unit)?"":" · "+where);
$("suma").textContent=(pct>=0?"+":"")+pct+"%"; $("suma").classList.toggle("cool",pct<=CPI_UP);
$("sumb").innerHTML=`since ${Y0} <span>· inflation: +${CPI_UP}%</span>`;
$("cta").textContent=Q.get("cta")||"Comment your year";
$("src").textContent=(S.jan?`BLS ${where==="U.S. average"?"U.S. ":""}averages via FRED, each January to ${label(B)}`:Q.get("src")||S.who||"published prices")+" · CPI-U";
// Fit the one-line texts inside the phone-safe width (860 px): the item name and the widest price.
const fit=(el,max,w=860)=>{el.style.fontSize=max+"px"; const r=w/el.scrollWidth; if(r<1) el.style.fontSize=Math.floor(max*r)+"px"};
const fitAll=()=>{fit($("item"),150); fit($("cta"),44); const t=$("px").textContent;
  $("px").textContent=fmt(Math.max(...P.map(p=>p[1]))); fit($("px"),128,560); $("px").textContent=t};
fitAll(); document.fonts.ready.then(fitAll);
// Chart: x by year; y from 0 to a top that grows with the highest price drawn so far, so the line keeps climbing the frame.
const CW=860, CH=600, PAD=70, X=x=>PAD+(x-A[0])/(B[0]-A[0])*(CW-PAD-20);
const STEPS=[.1,.25,.5,1,2,5,10,25,50,100,250,500,1e3,2.5e3,5e3,1e4,2.5e4,5e4,1e5,2.5e5,5e5];
function grid(top,Yp){const step=STEPS.find(s=>top/s<=4.5)||1e6; let g="";
  for(let v=step;v<top;v+=step) g+=`<line class="g" x1="${PAD}" x2="${CW}" y1="${Yp(v)}" y2="${Yp(v)}"/><text x="0" y="${Yp(v)+8}">${v>=1e3?"$"+v/1e3+"k":fmt(v).replace(/\.00$/,"")}</text>`;
  return g+`<line class="g" x1="${PAD}" x2="${CW}" y1="${Yp(0)}" y2="${Yp(0)}"/><text x="${PAD}" y="${CH}">${Y0}</text><text x="${CW-80}" y="${CH}">${Math.floor(B[0])}</text>`}
// Jump chips: one per big one-year rise (or fall), shown by the dot as that year lands.
const BIG=Math.max(8,[...JUMP].map(Math.abs).sort((a,b)=>b-a)[Math.min(4,JUMP.length-1)]);  // at most about five chips
const CHIPS=JUMP.map((j,i)=>Math.abs(j)>=BIG&&j?i:-1).filter(i=>i>=0);
$("chips").innerHTML=CHIPS.map(i=>`<div class="chip ${JUMP[i]>0?"u":"d"}" id="c${i}">${JUMP[i]>0?"+":""}${JUMP[i]}%</div>`).join("");
const R0=.5, R1=5.0, N=P.length-1, AT=k=>R0+(R1-R0)*k/N;  // the race; point k lands at AT(k)
window.render=function(t){
  const back=t>=9.5, main=back?ease((t-9.5)/.3):t<8?1:1-ease((t-8)/.25);
  $("cam").style.opacity=main;
  const f=back?0:clamp((t-R0)/(R1-R0)), k=Math.min(N,Math.floor(f*N+1e-9)), fr=f*N-k;
  const cur=P[k], nxt=P[Math.min(k+1,N)], since=back?-1:t-AT(k);
  // The top eases toward the highest price so far, so the chart zooms out as prices climb.
  const hi=Math.max(...P.slice(0,k+1).map(p=>p[1]), cur[1]+(nxt[1]-cur[1])*fr), top=Math.max(hi*1.25, A[1]*2);
  const Yp=v=>CH-40-v/top*(CH-80);
  $("grid").innerHTML=grid(top,Yp);
  $("yr").textContent=k===N?"Today":Math.floor(cur[0]); $("px").textContent=fmt(cur[1]);
  $("prod").textContent=cur[2]||"";  // the model, for gadgets and cars
  const kick=since>=0?1-ease(since/.16):0, last=k===N&&!back;
  $("px").style.transform=`scale(${last?1+.3*(1-ease((t-R1)/.45)):1+.1*kick})`;
  $("yr").style.transform=`scale(${1+.06*kick})`;
  const run=pctOf(cur[1]), inf=cpiUp(cur), hot=run>inf;
  $("run").innerHTML=k?`${run>=0?"+":""}${run}% since ${Y0} <span style="color:${hot?"var(--down)":"var(--up)"}">${hot?"▲ beating":"▼ under"} inflation</span>`:`&nbsp;`;
  $("px").style.color=JUMP[k]>=BIG&&since<.35?"var(--down)":"var(--up)";
  const pts=P.slice(0,k+1).map(p=>[X(p[0]),Yp(p[1])]);
  if(k<N) pts.push([X(cur[0]+(nxt[0]-cur[0])*fr),Yp(cur[1]+(nxt[1]-cur[1])*fr)]);
  $("ln").setAttribute("points",pts.map(p=>p.join(",")).join(" "));
  $("area").setAttribute("points",[[pts[0][0],Yp(0)],...pts,[pts[pts.length-1][0],Yp(0)]].map(p=>p.join(",")).join(" "));
  const [dx,dy]=pts[pts.length-1]; for(const id of ["dot","ring"]){$(id).setAttribute("cx",dx); $(id).setAttribute("cy",dy)}
  $("ring").setAttribute("r",12+40*(1-kick)*(kick>0)); $("ring").style.opacity=kick;
  CHIPS.forEach((i,n)=>{const c=$("c"+i), s=back?-1:t-AT(i), nx=CHIPS[n+1];  // a chip gives way to the next one
    const o=s<0?0:Math.min(ease(s/.12),1-ease((s-.55)/.25),nx==null?1:1-ease((t-AT(nx))/.08));
    c.style.opacity=o; const w=c.offsetWidth/2; c.style.left=clamp(110+X(P[i][0]),110+w,970-w)+"px"; c.style.top=(840+Yp(P[i][1])-24-30*ease(s/.8))+"px"});
  // A small camera push through the race and a jolt on each big jump.
  const jolt=CHIPS.reduce((m,i)=>{const s=t-AT(i); return s>=0&&s<.2?Math.max(m,1-s/.2):m},0)*(back?0:1);
  $("cam").style.transform=`scale(${1+.012*ease((t-R0)/(R1-R0))*(1-ease((t-R1)/.4))*(back?0:1)}) translate(${(jolt*6*Math.sin(t*90)).toFixed(1)}px,${(jolt*4*Math.cos(t*70)).toFixed(1)}px)`;
  $("hot").style.opacity=back?0:clamp(.15*kick*(JUMP[k]>=BIG)+.9*win(t,5.25,8,.3)*(pct>CPI_UP));
  $("pause").style.opacity=back?main:t<R1?1:1-ease((t-R1)/.2);
  $("sum").style.opacity=back?0:win(t,5.25,8,.15); $("sum").style.transform=`scale(${back3((t-5.25)/.4)*.4+.6})`;
  $("cta").style.opacity=back?0:win(t,5.9,8,.25);
  $("end").style.opacity=win(t,8.1,9.45,.25); $("end").style.transform=`scale(${.9+.1*back3((t-8.1)/.45)})`;
};
render(0);
</script></body></html>
