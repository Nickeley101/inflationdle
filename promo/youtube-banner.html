<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=block">
<script src="series.js"></script>
<style>
/* YouTube channel art: 2560x1440. Only the centre 1546x423 shows on every device, so all text sits inside it. */
*{margin:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden;background:radial-gradient(1400px 700px at 50% 50%,#12202c 0%,#0a0e13 70%);color:#dbe4ee;font-family:"IBM Plex Sans",system-ui,sans-serif}
svg{position:absolute;inset:0}
.safe{position:absolute;left:507px;top:509px;width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{font:800 165px/1 "Barlow Condensed","Arial Narrow",Impact,sans-serif;letter-spacing:.08em;color:#dbe4ee}
.logo em{font-style:normal;color:#1fd67f}
.tag{margin-top:18px;font:500 44px "IBM Plex Sans",sans-serif}
.tag em{font-style:normal;color:#f5b83d}
.tick{margin-top:30px;font:600 32px "JetBrains Mono",monospace;color:#7c8b9d;white-space:nowrap}
.tick span{padding:0 14px}.u{color:#1fd67f}
</style></head><body>
<svg id="s" viewBox="0 0 2560 1440"></svg>
<div class="safe">
  <div class="logo">INFLATION<em>DLE</em></div>
  <div class="tag">Guess what things cost, <em>any year since 1980</em>. A new price every day.</div>
  <div class="tick" id="tk"></div>
</div>
<script>
// faint index lines behind the text: each item's price relative to 1980
const ks=["GAS","EGGS","BREAD","COFFEE","BACON","BANANA","SUGAR"], x0=1980,x1=2026.6;
const X=x=>(x-x0)/(x1-x0)*2560, Y=r=>1250-(r-1)*170;
document.getElementById("s").innerHTML=ks.map((k,i)=>{const P=SER[k].pts.filter(p=>p[0]>=1980), b=P[0][1];
 return `<path d="${P.map((p,j)=>(j?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]/b).toFixed(1)).join("")}" fill="none" stroke="${i?"#233040":"#1fd67f"}" stroke-opacity="${i?.6:.35}" stroke-width="${i?5:8}"/>`}).join("");
const CU=Math.round((CPI.v[CPI.v.length-1]/CPI.v[(1980-1975)*12]-1)*100);
const T=["EGGS","BREAD","COFFEE","GAS"].map(k=>{const P=SER[k].pts, a=P.find(p=>p[0]===1980)[1];return [k,"+"+Math.round((P[P.length-1][1]/a-1)*100)+"%"]}).concat([["ALL PRICES","+"+CU+"%"]]);
document.getElementById("tk").innerHTML="SINCE 1980:"+T.map(([a,b])=>`<span>${a} <b class="u">${b}</b></span>`).join("");
</script></body></html>
