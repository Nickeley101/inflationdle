<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=block">
<script src="series.js"></script>
<style>
:root{--bg:#0a0e13;--line:#233040;--text:#dbe4ee;--muted:#7c8b9d;--up:#1fd67f;--down:#ff4d5e;--warm:#f5b83d;--cyan:#4cc9f0;
--mono:"JetBrains Mono",ui-monospace,monospace;--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{position:relative;overflow:hidden;background:radial-gradient(900px 700px at 50% 35%,#12202c 0%,var(--bg) 70%)}
.grid{position:absolute;inset:0;opacity:.3;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(closest-side,#000 40%,transparent)}
.abs{position:absolute;left:0;right:0;text-align:center}
.brand{font:800 50px var(--disp);letter-spacing:.02em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--up);text-shadow:0 0 30px rgba(31,214,127,.5)}
.k{font:600 32px var(--mono);color:var(--warm);letter-spacing:.08em}
.title{font:800 104px/1 var(--disp);text-transform:uppercase}
.year{font:800 200px/1 var(--disp);color:var(--muted)}
.price{font:800 220px/1 var(--disp);color:var(--up);text-shadow:0 0 60px rgba(31,214,127,.3)}
.unit{font:500 36px var(--sans);color:var(--muted)}
#chart{position:absolute}
#chart svg{width:100%;height:100%;overflow:visible}
.end .a{font:800 88px/1.05 var(--disp);text-transform:uppercase}
.end .a span{color:var(--up)} .end .a em{font-style:normal;color:var(--warm)}
.end .b{margin-top:22px;font:500 38px var(--sans);color:var(--muted)}
.src{font:400 24px var(--mono);color:#56657a}
</style></head>
<body><div id="stage">
<div class="grid"></div>
<div class="abs brand" id="brand">Inflation<em>dle</em></div>
<div class="abs" id="head"><div class="k">U.S. AVERAGE · REGULAR GAS</div><div class="title">A gallon of gas</div></div>
<div class="abs" id="ctr"><div class="year" id="yr">1980</div><div class="price" id="pr">$1.13</div><div class="unit">per gallon</div></div>
<div id="chart"><svg id="svg"></svg></div>
<div class="abs end" id="end"><div class="a">Gas: <span id="gup"></span> since 1980.<br>All prices: <em id="cup"></em>.</div><div class="b" id="gb"></div></div>
<div class="abs src" id="src">January prices, latest Aug 2026 · BLS via FRED</div>
</div>
<script>
const q=new URLSearchParams(location.search), SQ=q.get("fmt")==="s";
const W=1080,H=SQ?1080:1920; const st=document.getElementById("stage"); st.style.width=W+"px"; st.style.height=H+"px";
const L=SQ?{brand:40,head:110,ctr:250,chart:[70,560,940,400],end:280,src:1030,yrS:130,prS:150}:{brand:230,head:340,ctr:560,chart:[70,1020,940,560],end:560,src:1640,yrS:200,prS:220};
const $=id=>document.getElementById(id);
$("brand").style.top=L.brand+"px";$("head").style.top=L.head+"px";$("ctr").style.top=L.ctr+"px";$("end").style.top=L.end+"px";$("src").style.top=L.src+"px";
$("yr").style.fontSize=L.yrS+"px";$("pr").style.fontSize=L.prS+"px";
if(SQ){$("head").querySelector(".title").style.fontSize="80px"}
const [cx,cy,cw,ch]=L.chart; Object.assign($("chart").style,{left:cx+"px",top:cy+"px",width:cw+"px",height:ch+"px"});
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const win=(t,a,b,f=.35)=>Math.min(ease((t-a)/f),ease((b-t)/f));
const P=SER.GAS.pts.filter(p=>p[0]>=1980), x0=1980,x1=P[P.length-1][0], ymax=4.5;
const X=x=>(x-x0)/(x1-x0)*cw, Y=y=>ch-40-(y/ymax)*(ch-70);
$("svg").setAttribute("viewBox",`0 0 ${cw} ${ch}`);
$("svg").innerHTML=[1,2,3,4].map(v=>`<line x1="0" x2="${cw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#233040" stroke-width="2"/><text x="0" y="${Y(v)-10}" fill="#56657a" font-family="JetBrains Mono" font-size="28">$${v}</text>`).join("")
 +[1980,1990,2000,2010,2020].map(v=>`<text x="${X(v)}" y="${ch}" fill="#56657a" font-family="JetBrains Mono" font-size="28" text-anchor="middle">${v}</text>`).join("")
 +`<path id="ln" fill="none" stroke="#1fd67f" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle id="dot" r="16" fill="#f5b83d"/>`;
// value at fractional year (linear between points)
function at(x){for(let i=1;i<P.length;i++)if(x<=P[i][0]){const [a,pa]=P[i-1],[b,pb]=P[i];return pa+(pb-pa)*(x-a)/(b-a)}return P[P.length-1][1]}
const T0=1.2,T1=10.2, MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const [LY,LM]=SER.GAS.pts[SER.GAS.pts.length-1][3].split("-").map(Number), LATEST=MON[LM-1].slice(0,3)+" "+LY;
$("src").textContent=`January prices, latest ${LATEST} · BLS via FRED`;
{const g=Math.round((P[P.length-1][1]/P[0][1]-1)*100), c=Math.round((CPI.v[CPI.v.length-1]/CPI.v[(1980-1975)*12]-1)*100);
 $("gup").textContent="+"+g+"%"; $("cup").textContent="+"+c+"%";
 $("gb").textContent=g<c?"Adjusted for inflation, gas is cheaper than in 1980.":"Gas rose faster than everything else.";}
window.render=function(t){
  const f=clamp((t-T0)/(T1-T0)), fe=f<1?f*f*(3-2*f):1, x=x0+(x1-x0)*fe;
  let d="";for(const p of P){if(p[0]>x)break;d+=(d?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)}
  d+=(d?"L":"M")+X(x).toFixed(1)+" "+Y(at(x)).toFixed(1);
  $("ln").setAttribute("d",d); $("dot").setAttribute("cx",X(x)); $("dot").setAttribute("cy",Y(at(x)));
  $("yr").textContent = f>=1 ? LATEST.toUpperCase() : Math.floor(x); const lp=f>=1?P[P.length-1]:P.filter(p=>p[0]<=x).pop(); $("pr").textContent="$"+lp[1].toFixed(2);
  const a=win(t,.1,11.2,.3);
  $("head").style.opacity=a; $("ctr").style.opacity=a; $("chart").style.opacity=Math.min(ease((t-.3)/.4), SQ? ease((11.2-t)/.3):1);
  $("end").style.opacity=ease((t-11.4)/.4); $("end").style.transform=`translateY(${(1-ease((t-11.4)/.5))*40}px)`;
  if(!SQ){$("chart").style.opacity=Math.min(ease((t-.3)/.4),1)}
  if(!SQ){$("end").style.top=(L.end)+"px"}
  $("src").style.opacity=ease((t-.5)/.4);
};
if(!SQ){ // keep the chart on screen at the end in 9:16; the counter makes room
  const r0=window.render; window.render=t=>{r0(t);$("ctr").style.opacity=win(t,.1,11.2,.3)}}
render(0);
</script></body></html>
